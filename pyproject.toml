[project]
name = "threat-identification-system"
version = "1.0.0"
description = "Enterprise-grade AI-powered security surveillance platform with real-time weapon detection, face recognition, and multi-channel alerting"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Vijaya Sivanjan Kommuri"}]
readme = "README.md"

dependencies = [
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "python-multipart>=0.0.26",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Cache / Pub-Sub
    "redis>=5.0",
    # Configuration
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Security
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # ML — Detection
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.1",
    "onnxruntime>=1.17",
    # ML — Recognition
    "deepface>=0.0.89",
    # Computer Vision
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    # Observability
    "structlog>=24.1",
    "prometheus-client>=0.20",
    # Alerting
    "httpx>=0.27",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.17",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "bandit>=1.7",
]
test = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "faker>=24.0",
    "locust>=2.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "S", "A", "C4", "PT"]
ignore = ["E501", "S101", "S104", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

# ─────────────────────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

# ─────────────────────────────────────────────────────────────────────────────
# Mypy
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = false
plugins = ["pydantic.mypy"]

# ─────────────────────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["threat_id"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
    "\\.\\.\\.",
]

# ─────────────────────────────────────────────────────────────────────────────
# Bandit
# ─────────────────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
